<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="net.milmit.LinuxCare.Helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.milmit.LinuxCare.Helper" send_interface="net.milmit.LinuxCare.Helper1"/>
  </policy>
</busconfig>
