name: linuxcare
base: core24
version: '0.7.0-beta.2'
title: LinuxCare
summary: Safe, professional Linux maintenance and storage suite
description: |
  LinuxCare is a modern GTK4/Libadwaita application for Ubuntu and GNOME desktops
  developed by MilMit (https://milmit.net).
  It provides safe cleanup for APT package caches, Snap revisions, system journals,
  storage analytics, live system vitals, network diagnostics, live socket ownership/eBPF readiness, container storage analysis, package diagnostics, battery health, hardware inventory, Safety Quarantine, maintenance timeline, GNOME integration, and security auditing.

website: https://milmit.net
source-code: https://github.com/MilMit/LinuxCare
issues: https://github.com/MilMit/LinuxCare/issues
contact: mailto:info@milmit.net
icon: data/icons/hicolor/scalable/apps/net.milmit.LinuxCare.svg

grade: devel
# LinuxCare performs host-level maintenance and therefore intentionally uses
# classic confinement. Public Snap Store publication requires classic
# confinement approval from the Store review team before release.
confinement: classic

plugs:
  polkit:
    interface: polkit
    action-prefix: net.milmit.LinuxCare

slots:
  linuxcare-helper-dbus:
    interface: dbus
    bus: system
    name: net.milmit.LinuxCare.Helper

apps:
  linuxcare:
    command: usr/bin/linuxcare
    desktop: usr/share/applications/net.milmit.LinuxCare.desktop
    environment:
      XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas

  linuxcare-helper:
    command: usr/libexec/linuxcare-helper
    daemon: dbus
    activates-on:
      - linuxcare-helper-dbus
    plugs:
      - polkit

parts:
  linuxcare:
    plugin: rust
    source: .
    build-attributes:
      - enable-patchelf
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - libgraphene-1.0-dev
      - libglib2.0-bin
      - pkg-config
    stage-packages:
      - libgtk-4-1
      - libadwaita-1-0
      - libgraphene-1.0-0
    override-build: |
      cargo build --release --workspace
      install -Dm755 target/release/linuxcare $CRAFT_PART_INSTALL/usr/bin/linuxcare
      install -Dm755 target/release/linuxcare-maintenance $CRAFT_PART_INSTALL/usr/bin/linuxcare-maintenance
      install -Dm755 target/release/linuxcare-helper $CRAFT_PART_INSTALL/usr/libexec/linuxcare-helper
      install -Dm644 data/net.milmit.LinuxCare.desktop $CRAFT_PART_INSTALL/usr/share/applications/net.milmit.LinuxCare.desktop
      install -Dm644 data/net.milmit.LinuxCare.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/net.milmit.LinuxCare.metainfo.xml
      install -Dm644 data/icons/hicolor/scalable/apps/net.milmit.LinuxCare.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/net.milmit.LinuxCare.svg
      install -Dm644 data/polkit-1/actions/net.milmit.LinuxCare.policy $CRAFT_PART_INSTALL/meta/polkit/polkit.linuxcare.policy
    override-prime: |
      craftctl default
      if [ -d "$CRAFT_PRIME/usr/share/glib-2.0/schemas" ]; then
        glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      fi
