name: linuxcare
base: core24
version: '0.7.0-beta.2'
title: LinuxCare
summary: Safe Linux maintenance, diagnostics and storage intelligence
description: |
  LinuxCare is a modern GTK4/Libadwaita application for Ubuntu and GNOME desktops
  developed by MilMit (https://milmit.net).

  The Snap Store edition uses strict confinement. It provides live system vitals,
  storage and hardware diagnostics, network and process insight, battery health,
  security auditing, and safety-first cleanup of explicitly declared user-owned
  cache/trash locations. Host package-manager mutation, disabled-Snap removal,
  system journal vacuuming, privileged SMART access and GNOME Shell extension
  management remain available in the full Debian edition where LinuxCare can use
  its narrow Polkit-authorized helper.

website: https://milmit.net
source-code: https://github.com/MilMit/LinuxCare
issues: https://github.com/MilMit/LinuxCare/issues
contact: mailto:info@milmit.net
icon: data/icons/hicolor/scalable/apps/net.milmit.LinuxCare.svg

grade: devel
confinement: strict

# LinuxCare's cleaner needs the real user's hidden cache/trash locations. Keep
# this declaration deliberately narrow: no arbitrary home access and no host
# package-manager/system directories are exposed to the Store edition.
plugs:
  dot-linuxcare-cleanup-data:
    interface: personal-files
    write:
      - $HOME/.cache
      - $HOME/.local/share/Trash
      - $HOME/.cargo/registry/cache
      - $HOME/.npm/_cacache
      - $HOME/.local/share/coredump
      - $HOME/.config/linuxcare
      - $HOME/.local/state/linuxcare
      - $HOME/.local/share/linuxcare

apps:
  linuxcare:
    command: usr/bin/linuxcare
    desktop: usr/share/applications/net.milmit.LinuxCare.desktop
    common-id: net.milmit.LinuxCare
    extensions:
      - gnome
    plugs:
      - home
      - removable-media
      - network
      - system-observe
      - hardware-observe
      - network-observe
      - network-setup-observe
      - network-manager-observe
      - log-observe
      - upower-observe
      - dot-linuxcare-cleanup-data
    environment:
      LINUXCARE_STORE_EDITION: '1'
      HOME: $SNAP_REAL_HOME
      XDG_CONFIG_HOME: $SNAP_REAL_HOME/.config
      XDG_STATE_HOME: $SNAP_REAL_HOME/.local/state
      XDG_DATA_HOME: $SNAP_REAL_HOME/.local/share

parts:
  # Snapcraft's Rust plugin validates that rustup is available before entering
  # the build lifecycle. The GNOME extension changes the build environment, so
  # make the toolchain an explicit dependency rather than relying on a host
  # rustup installation. rust-toolchain.toml still pins LinuxCare to Rust 1.93.
  rust-deps:
    plugin: nil
    build-snaps:
      - rustup/latest/stable
    override-build: |
      rustup toolchain install 1.93.0 --profile minimal
      rustup default 1.93.0

  linuxcare:
    after:
      - rust-deps
    plugin: rust
    source: .
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - libgraphene-1.0-dev
      - pkg-config
    override-build: |
      cargo build --release --bin linuxcare
      install -Dm755 target/release/linuxcare $CRAFT_PART_INSTALL/usr/bin/linuxcare
      install -Dm644 data/net.milmit.LinuxCare.desktop $CRAFT_PART_INSTALL/usr/share/applications/net.milmit.LinuxCare.desktop
      install -Dm644 data/net.milmit.LinuxCare.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/net.milmit.LinuxCare.metainfo.xml
      install -Dm644 data/icons/hicolor/scalable/apps/net.milmit.LinuxCare.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/net.milmit.LinuxCare.svg
