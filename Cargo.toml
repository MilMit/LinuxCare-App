[package]
name = "linuxcare"
version = "0.7.0-beta.2"
edition = "2021"
rust-version = "1.92"
authors = ["MilMit <info@milmit.net>"]
homepage = "https://milmit.net"
description = "A safety-first Linux maintenance suite for GNOME desktops by MilMit"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11.4" }
adw = { package = "libadwaita", version = "0.9.2" }
glib = "0.22"
walkdir = "2.5"
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync"] }

[profile.release]
strip = "symbols"
