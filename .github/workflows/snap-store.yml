name: LinuxCare Snap Store

on:
  pull_request:
    paths:
      - 'snapcraft.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'data/**'
      - '.github/workflows/snap-store.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

jobs:
  snap:
    name: Build, smoke-test & optionally publish Snap
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Install Snap smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 libglib2.0-bin

      - name: Install locally as classic Snap
        run: sudo snap install --dangerous --classic "${{ steps.snapcraft.outputs.snap }}"

      - name: Connect local Polkit interface for smoke test
        run: sudo snap connect linuxcare:polkit

      - name: Verify Polkit policy installation
        run: |
          snap connections linuxcare
          grep -Rsl 'net.milmit.LinuxCare.clean-apt-cache' /usr/share/polkit-1/actions/ | grep '/snap.linuxcare.'

      - name: Verify helper is D-Bus activated, not boot-started
        run: |
          service='snap.linuxcare.linuxcare-helper.service'

          if systemctl is-active --quiet "$service"; then
            echo 'linuxcare-helper unexpectedly started before a D-Bus request' >&2
            sudo systemctl status "$service" --no-pager || true
            exit 1
          fi

          set +e
          reply="$(timeout 15s busctl call \
            net.milmit.LinuxCare.Helper \
            /net/milmit/LinuxCare/Helper \
            net.milmit.LinuxCare.Helper1 \
            GetVersion 2>&1)"
          rc=$?
          set -e
          echo "$reply"

          if [ "$rc" -ne 0 ]; then
            echo "D-Bus GetVersion failed with exit code $rc" >&2
            echo '--- snap services ---'
            snap services linuxcare || true
            echo '--- generated systemd unit ---'
            sudo systemctl cat "$service" --no-pager || true
            echo '--- systemd status ---'
            sudo systemctl status "$service" --no-pager || true
            echo '--- helper journal ---'
            sudo journalctl -u "$service" --no-pager -n 200 || true
            echo '--- snap logs ---'
            sudo snap logs linuxcare.linuxcare-helper -n=200 || true
            echo '--- D-Bus name state ---'
            busctl --system list | grep -F 'net.milmit.LinuxCare.Helper' || true
            exit "$rc"
          fi

          grep -F '0.7.0-beta.2' <<<"$reply"
          systemctl is-active --quiet "$service"

      - name: Verify bundled GSettings schemas
        run: |
          snap run --shell linuxcare -c '
            set -eu
            schema_dir="$GSETTINGS_SCHEMA_DIR"
            echo "GSETTINGS_SCHEMA_DIR=$schema_dir"
            ls -lah "$schema_dir"
            test -s "$schema_dir/gschemas.compiled"
            test -f "$schema_dir/org.gnome.desktop.interface.gschema.xml"
            test -f "$schema_dir/org.gnome.desktop.a11y.interface.gschema.xml"

            # Parse only the schema source bundled in the snap so the clean
            # runner cannot accidentally satisfy this check from host data.
            schema_list="$(mktemp)"
            XDG_DATA_HOME="$(mktemp -d)" \
            XDG_DATA_DIRS="$SNAP/usr/share" \
            GSETTINGS_SCHEMA_DIR="$schema_dir" \
              gsettings list-schemas >"$schema_list"
            grep -Fx 'org.gnome.desktop.interface' "$schema_list"
            grep -Fx 'org.gnome.desktop.a11y.interface' "$schema_list"
            grep -Fx 'org.gtk.gtk4.Settings.FileChooser' "$schema_list"
          '

      - name: GUI startup smoke from installed Snap
        run: |
          timeout 20s dbus-run-session -- \
            xvfb-run -a -s '-screen 0 1024x600x24 -nolisten tcp' \
            env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory \
                G_DEBUG=fatal-criticals LINUXCARE_GUI_SMOKE=1 \
            snap run linuxcare

      - name: Upload Snap build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxcare-snap-${{ github.sha }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Publish prerelease to Snap Store beta channel
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: beta

      - name: Publish stable release to Snap Store stable channel
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
