name: Bug report
description: Report a reproducible LinuxCare problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please avoid posting passwords, tokens, private logs, or unrelated personal data.
  - type: input
    id: version
    attributes:
      label: LinuxCare version
      placeholder: 0.7.0-beta.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution / GNOME version
      placeholder: Ubuntu 24.04 / GNOME 46
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open …\n2. Click …\n3. Observe …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      description: Remove secrets, usernames and unrelated paths before posting.
      render: shell
